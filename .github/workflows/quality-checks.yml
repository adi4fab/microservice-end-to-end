name: quality-checks

on:
  pull_request:
  push:
    branches: [main]

# Triggering on pull_request + push-to-main rather than on every push:
# same protection, a fraction of the runs, and no duplicate execution on
# PR branches.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2   # the same pinned versions as local

      - uses: pre-commit/action@v3.0.1

      - name: terragrunt hcl validate
        run: mise exec -- terragrunt hcl validate --working-dir IAC-terragrunt/live

      - name: source hygiene
        shell: bash
        run: |
          # Scans BOTH .hcl and .tf — a module block can appear in either.
          # Excludes .terragrunt-cache / .terraform: those hold DOWNLOADED
          # third-party code, so scanning them reports other people's sources
          # as our violations.
          set -uo pipefail
          fail=0

          # An unpinned module changes under you: identical code, different
          # infrastructure on different days.
          if grep -rn 'git::' --include='*.hcl' --include='*.tf' \
               --exclude-dir='.terragrunt-cache' --exclude-dir='.terraform' \
               IAC-terragrunt | grep -v '?ref='; then
            echo "::error::unpinned git:: source above — add ?ref=<tag>"
            fail=1
          fi

          # tfr:/// resolves to registry.terraform.io even when the engine is
          # OpenTofu. The registry is only an index over GitHub — go direct.
          if grep -rn 'tfr:' --include='*.hcl' --include='*.tf' \
               --exclude-dir='.terragrunt-cache' --exclude-dir='.terraform' \
               IAC-terragrunt; then
            echo "::error::tfr:// source above — use git:: with ?ref= instead"
            fail=1
          fi

          exit $fail
