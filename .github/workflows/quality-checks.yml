name: quality-checks

on:
  pull_request:
  push:
    branches: [main]

# Triggering on pull_request + push-to-main rather than on every push:
# same protection, a fraction of the runs, and no duplicate execution on
# PR branches.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2   # the same pinned versions as local

      - uses: pre-commit/action@v3.0.1

      - name: terragrunt hcl validate
        run: mise exec -- terragrunt hcl validate --working-dir IAC-terragrunt/live

      - name: "no unpinned git:: sources"
        run: |
          # A module source without ?ref= changes under you: identical code,
          # different infrastructure on different days.
          ! grep -rn 'git::' --include='*.hcl' IAC-terragrunt/ | grep -v '?ref=' \
            || { echo "unpinned git:: source above — add ?ref=<tag>"; exit 1; }

      - name: "no tfr:// registry shorthand"
        run: |
          # tfr:/// resolves to registry.terraform.io even when the engine is
          # OpenTofu. Use git:: and pin the tag.
          ! grep -rn 'tfr:' --include='*.hcl' IAC-terragrunt/ \
            || { echo "tfr:// source above — use git:: with ?ref= instead"; exit 1; }
