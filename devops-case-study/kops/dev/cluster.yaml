apiVersion: kops.k8s.io/v1alpha2
kind: Cluster
metadata:
  name: microsvc-dev.k8s.internal
spec:
  channel: stable
  cloudProvider: aws
  configBase: s3://microsvc-dev-kops-state/microsvc-dev.k8s.internal
  kubernetesVersion: 1.35.5

  # Real private DNS (not gossip). `.internal` is the ICANN-reserved private-use
  # TLD — resolves only inside the VPC via a Route53 *private* hosted zone, which
  # is what topology.dns.type: Private below expects.
  dnsZone: k8s.internal

  networking:
    cilium:
      enableEncryption: true
      encryptionType: wireguard
  networkCIDR: 172.20.0.0/16
  topology:
    masters: private
    nodes: private
    dns:
      type: Private
    bastion:
      enabled: true
  subnets:
    - name: us-west-1a
      type: Private
      zone: us-west-1a
      cidr: 172.20.32.0/19
    - name: us-west-1c
      type: Private
      zone: us-west-1c
      cidr: 172.20.64.0/19
    - name: utility-us-west-1a
      type: Utility
      zone: us-west-1a
      cidr: 172.20.0.0/22
    - name: utility-us-west-1c
      type: Utility
      zone: us-west-1c
      cidr: 172.20.4.0/22

  sshAccess:
    - 10.0.0.0/8
  kubernetesApiAccess:
    - 10.0.0.0/8

  authorization:
    rbac: {}
  encryptionConfig: true
  iam:
    allowContainerRegistry: true
    useServiceAccountExternalPermissions: true
  serviceAccountIssuerDiscovery:
    enableAWSOIDCProvider: true
    discoveryStore: s3://microsvc-dev-oidc-store/microsvc-dev.k8s.internal

  kubeAPIServer:
    anonymousAuth: false
    tlsMinVersion: VersionTLS12
    auditLogPath: /var/log/kube-apiserver-audit.log
    auditLogMaxAge: 30
    auditLogMaxBackups: 10
    auditLogMaxSize: 100
    auditPolicyFile: /srv/kubernetes/audit/policy.yaml

  kubelet:
    anonymousAuth: false
    authenticationTokenWebhook: true
    authorizationMode: Webhook
    readOnlyPort: 0
    protectKernelDefaults: true
    streamingConnectionIdleTimeout: 5m
    tlsCipherSuites:
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

  fileAssets:
    - name: audit-policy
      path: /srv/kubernetes/audit/policy.yaml
      roles:
        - ControlPlane
      content: |
        apiVersion: audit.k8s.io/v1
        kind: Policy
        omitStages:
          - RequestReceived
        rules:
          - level: None
            verbs: ["get", "list", "watch"]
          - level: Metadata
            resources:
              - group: ""
                resources: ["secrets", "configmaps"]
          - level: RequestResponse
            resources:
              - group: "rbac.authorization.k8s.io"
          - level: Metadata

  # dev is single-control-plane (cost-saving, non-HA) -> single etcd member.
  etcdClusters:
    - name: main
      cpuRequest: 200m
      memoryRequest: 100Mi
      etcdMembers:
        - name: a
          instanceGroup: control-plane-us-west-1a
          encryptedVolume: true
    - name: events
      cpuRequest: 100m
      memoryRequest: 100Mi
      etcdMembers:
        - name: a
          instanceGroup: control-plane-us-west-1a
          encryptedVolume: true

  clusterAutoscaler:
    enabled: true
    awsUseStaticInstanceList: false
    scaleDownUtilizationThreshold: "0.5"
    skipNodesWithLocalStorage: false
    skipNodesWithSystemPods: false

  nodeTerminationHandler:
    enabled: true
    enableSpotInterruptionDraining: true
    enableScheduledEventDraining: true

  metricsServer:
    enabled: true

  certManager:
    enabled: true
