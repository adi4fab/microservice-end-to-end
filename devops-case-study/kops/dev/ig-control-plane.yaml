apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: control-plane-us-west-1a
  labels:
    kops.k8s.io/cluster: microsvc-dev.k8s.internal
spec:
  role: ControlPlane
  machineType: m6i.large
  minSize: 1
  maxSize: 1
  subnets:
    - us-west-1a
  rootVolumeSize: 64
  rootVolumeType: gp3
  rootVolumeEncryption: true
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
