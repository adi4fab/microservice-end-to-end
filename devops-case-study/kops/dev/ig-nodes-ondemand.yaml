apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: nodes-ondemand
  labels:
    kops.k8s.io/cluster: microsvc-dev.k8s.internal
spec:
  role: Node
  machineType: m6i.large
  minSize: 1
  maxSize: 4
  subnets:
    - us-west-1a
    - us-west-1c
  rootVolumeSize: 100
  rootVolumeType: gp3
  rootVolumeEncryption: true
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
  nodeLabels:
    lifecycle: on-demand
  cloudLabels:
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/microsvc-dev.k8s.internal: "owned"
