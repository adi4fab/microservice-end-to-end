apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: nodes-mixed
  labels:
    kops.k8s.io/cluster: microsvc-prod.k8s.internal
spec:
  role: Node
  minSize: 3
  maxSize: 15
  subnets:
    - us-east-1a
    - us-east-1b
    - us-east-1c
  rootVolumeSize: 100
  rootVolumeType: gp3
  rootVolumeEncryption: true
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
  # Mixed instance types AND mixed lifecycle: a stable on-demand base with
  # the rest filled from Spot, so the group stays up if Spot is reclaimed.
  mixedInstancesPolicy:
    instances:
      - m6i.large
      - m6a.large
      - m5.large
    onDemandBase: 2                  # always keep 2 on-demand for baseline capacity
    onDemandAboveBasePercentage: 30  # above the base: 30% on-demand, 70% Spot
    spotAllocationStrategy: capacity-optimized
  nodeLabels:
    lifecycle: mixed
  cloudLabels:
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/microsvc-prod.k8s.internal: "owned"
