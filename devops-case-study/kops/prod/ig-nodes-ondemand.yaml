apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: nodes-ondemand
  labels:
    kops.k8s.io/cluster: microsvc-prod.k8s.internal
spec:
  role: Node
  machineType: m6i.large
  minSize: 2
  maxSize: 6
  subnets:
    - us-east-1a
    - us-east-1b
    - us-east-1c
  rootVolumeSize: 100
  rootVolumeType: gp3
  rootVolumeEncryption: true
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
  nodeLabels:
    lifecycle: on-demand
  cloudLabels:
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/microsvc-prod.k8s.internal: "owned"
