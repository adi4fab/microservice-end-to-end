---
# Deploy csv-processor to the selected environment.
# Ansible owns the application config (vars/<env>.yml) and feeds it to Helm,
# which renders the Kubernetes objects.
#
#   ansible-playbook deploy.yml -e env=dev
#   ansible-playbook deploy.yml -e env=prod
- name: Deploy csv-processor ({{ env }})
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "vars/{{ env }}.yml"
  vars:
    release: csv-processor
    chart: "{{ playbook_dir }}/../helm/csv-processor"
  tasks:
    - name: Ensure env is set
      ansible.builtin.assert:
        that: env in ['dev', 'prod']
        fail_msg: "Pass -e env=dev or -e env=prod"

    - name: helm upgrade --install (app config injected from Ansible)
      ansible.builtin.shell: |
        helm upgrade --install {{ release }} {{ chart }} \
          --namespace {{ namespace }} --create-namespace \
          -f {{ chart }}/values-{{ env }}.yaml \
          --set image.tag={{ image_tag }} \
          {% for k, v in app_config.items() %}--set-string config.{{ k }}={{ v }} {% endfor %}
      register: helm_out
      changed_when: true

    - name: Helm output
      ansible.builtin.debug:
        var: helm_out.stdout_lines
