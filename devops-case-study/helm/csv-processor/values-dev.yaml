# dev overrides (runs on the local kind cluster for the demo)
replicaCount: 1

image:
  tag: "1.0.0"

service:
  type: ClusterIP

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

serviceAccount:
  # In a real dev cluster this would be the dev IRSA role ARN.
  roleArn: ""

# kind has no IRSA, so the demo injects temporary AWS creds via this Secret.
awsCredentialsSecret: aws-creds
