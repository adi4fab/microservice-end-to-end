# Default values. Per-environment overrides live in values-dev.yaml / values-prod.yaml,
# and the application config (the `config` map) is supplied by Ansible at deploy time.

replicaCount: 2

image:
  repository: never4ade/csv-processor
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nginx:
  image: nginxinc/nginx-unprivileged:1.27-alpine
  # nginx listens here (8081); the app listens on app port (8080). Both share the
  # pod network namespace, so the ports must differ.
  port: 8081

# Application config -> rendered into a ConfigMap -> injected as env vars.
# All three are populated per environment by Ansible (vars/<env>.yml); the
# blanks here are just the contract. Templates fall back to PORT 8080 only if
# the chart is rendered without Ansible.
config:
  SECRET_ID: ""
  AWS_REGION: ""
  PORT: ""

serviceAccount:
  create: true
  name: csv-processor
  # IRSA role ARN (per env) so pods reach S3/Secrets Manager without static keys.
  roleArn: ""

# Optional: name of a Secret holding AWS_* env vars. Only for clusters without
# IRSA (e.g. the local kind cluster). In real clusters leave empty and use IRSA.
awsCredentialsSecret: ""

service:
  type: ClusterIP
  port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  app:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  nginx:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

networkPolicy:
  enabled: true

# Namespace-level Pod Security Standards label applied via the chart's namespace
# (or set on an existing namespace).
podSecurityStandard: restricted
