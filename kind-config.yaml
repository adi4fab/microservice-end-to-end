# kind cluster: 1 control-plane (master) + 2 workers
# Create:  kind create cluster --config kind-config.yaml
# Delete:  kind delete cluster --name local
#
# Note: kind names the underlying Docker containers itself
# (local-control-plane, local-worker, local-worker2). The Kubernetes node names
# shown by `kubectl get nodes` are overridden below via nodeRegistration.name
# (master, worker-1, worker-2). The kubectl context will be `kind-local`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: master
    # expose ingress/host ports here later if needed, e.g.:
    # extraPortMappings:
    #   - containerPort: 80
    #     hostPort: 80
    #   - containerPort: 443
    #     hostPort: 443
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-1
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-2
