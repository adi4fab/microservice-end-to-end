# kind cluster: 1 control-plane (master) + 2 workers
# Create:  kind create cluster --config kind-config.yaml
# Delete:  kind delete cluster --name microsvc
#
# Note: kind names the underlying Docker containers itself
# (microsvc-worker, microsvc-worker2). The Kubernetes node names shown by
# `kubectl get nodes` are overridden below via nodeRegistration.name.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: microsvc
nodes:
  - role: control-plane
    # expose ingress/host ports here later if needed, e.g.:
    # extraPortMappings:
    #   - containerPort: 80
    #     hostPort: 80
    #   - containerPort: 443
    #     hostPort: 443
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: microsvc-worker-1
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: microsvc-worker-2
